<!DOCTYPE html>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  .thread { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border); cursor: pointer; align-items: center; min-height: 68px; }
  .thread:first-child { border-top: 0; }
  .thread:active { background: var(--bg2); }
  .thread .av { width: 42px; height: 42px; }
  .thread .bd { flex: 1; min-width: 0; }
  .thread .bd b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .bd small { display: block; color: var(--ink3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .side { flex: none; text-align: right; font-size: 12px; color: var(--ink3); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .thread.unread .bd b, .thread.unread .side { color: var(--ink); }
  .thread .ub { width: 12px; height: 12px; border-radius: 50%; background: #25D366; display: block; }
  /* Chat */
  body.chat-open .wrap { padding-bottom: 0; }
  #chat { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
  /* (The laptop split view below places the open conversation beside the list.) */
  .chat-h { display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--card); }
  .chat-h .t { flex: 1; min-width: 0; }
  .chat-h .t b { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-h .t small { display: block; color: var(--ink3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-h a.t { color: inherit; text-decoration: none; }
  .pinned { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); font-size: 13.5px; }
  .pinned .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px;
    background: light-dark(#EFEAE2, #0E1416); }
  .day { align-self: center; font-size: 12px; color: var(--ink2); background: var(--card); padding: 4px 10px; border-radius: 8px; margin: 8px 0; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
  .bub { max-width: min(78%, 520px); padding: 6px 10px 4px; border-radius: 10px; font-size: 14.5px; line-height: 1.38; box-shadow: 0 1px 1px rgba(0,0,0,.08);
    white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
  .bub.them { align-self: flex-start; background: var(--card); border-top-left-radius: 2px; }
  .bub.mine { align-self: flex-end; background: light-dark(#D9FDD3, #144D37); border-top-right-radius: 2px; }
  .bub .by { display: block; font-size: 12px; font-weight: 650; color: var(--brand-ink); margin-bottom: 1px; }
  .bub .meta { display: block; text-align: right; font-size: 11px; color: var(--ink3); margin-top: 2px; }
  .bub .meta .tick.read { color: #34B7F1; }
  .sys { align-self: center; max-width: 88%; text-align: center; font-size: 12.5px; color: var(--ink2); background: light-dark(#FFF6D6, #2A2614); padding: 6px 10px; border-radius: 8px; margin: 4px 0; }
  .compose { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--card); }
  .compose textarea { min-height: 44px; max-height: 140px; border-radius: 22px; padding: 11px 16px; resize: none; }
  .compose .send { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: #25D366; color: #06240F; font-size: 18px; cursor: pointer; }
  .compose .send:disabled { opacity: .5; }
  /* Typing with the keyboard up: the pinned card folds to one line, the messages keep the room. */
  /* (Only while the reply box has focus — never when a button in the card is pressed, which would
     fold the button away under the finger.) */
  @media (max-width: 899px) { #chat:has(#text:focus) .pinned .acts, #chat:has(#text:focus) .pinned > div:not(.acts) { display: none; } }
  .bub.mine .meta { color: light-dark(#5C6E59, #B9D4C2); }
  .readonly-note { padding: 8px 12px; font-size: 12.5px; background: light-dark(#FFF7E0, rgba(255,190,40,.12)); color: light-dark(#6B4600, #FFD27A); border-bottom: 1px solid var(--border); }
  /* Replies. The quote inside a reply (tap → the message it answers); the reply bar above the box; the
     reply arrow — beside a message on hover (laptop), drawn out by a swipe to the right (phone). */
  .msgs { overflow-x: hidden; }
  .bub, .sys { touch-action: pan-y pinch-zoom; transition: translate .18s ease-out; }
  .sys { position: relative; }
  .bub.swiping, .sys.swiping { transition: none; }
  .bub .quote { display: block; width: 100%; min-width: 0; margin: 2px 0 5px; padding: 5px 9px 6px; border: 0; border-left: 4px solid var(--brand); border-radius: 6px;
    background: light-dark(rgba(0,0,0,.05), rgba(255,255,255,.07)); color: inherit; font: inherit; text-align: left; white-space: normal; cursor: pointer; }
  .bub .quote b { display: block; font-size: 12.5px; font-weight: 650; color: var(--brand-ink); }
  .bub .quote span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; color: var(--ink2); overflow-wrap: anywhere; }
  .bub .quote.me, .replybar .rq.me { border-left-color: light-dark(#1F9D55, #3DDC84); }
  .bub .quote.me b, .replybar .rq.me b { color: light-dark(#167A3F, #7EE2A8); }
  /* Inside your own green bubble: a deeper ground and darker type, readable at 4.5:1 in both themes. */
  .bub.mine .quote { background: light-dark(rgba(0,0,0,.06), rgba(0,0,0,.24)); }
  .bub.mine .quote b { color: light-dark(#7A4300, #FFB55C); }
  .bub.mine .quote span { color: light-dark(#3D4A3B, #D5DDD3); }
  .bub.mine .quote.me b { color: light-dark(#0F5E2F, #7EE2A8); }
  /* The reply arrow: hidden until the message is hovered (laptop), tapped (phone) or the arrow has the
     keyboard's focus — never hidden from the keyboard or a screen reader. */
  .rp { position: absolute; top: 50%; translate: 0 -50%; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1px solid var(--border); display: grid; place-items: center;
    background: var(--card); color: var(--ink2); box-shadow: 0 1px 3px rgba(0,0,0,.14); cursor: pointer; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 1; /* above the hover bridge below */ }
  .bub.them .rp { right: -40px; }
  .bub.mine .rp { left: -40px; }
  .sys .rp { right: -16px; }
  .rp:focus-visible, .bub.tapped > .rp, .sys.tapped > .rp { opacity: 1; pointer-events: auto; }
  @media (hover: hover) {
    .bub:hover > .rp, .sys:hover > .rp { opacity: 1; pointer-events: auto; }
    .rp:hover { color: var(--ink); background: var(--bg2); }
    /* The room between a message and its arrow still counts as the message, so the arrow stays put. */
    .bub.them::after, .bub.mine::after { content: ""; position: absolute; top: 0; bottom: 0; width: 46px; }
    .bub.them::after { left: 100%; }
    .bub.mine::after { right: 100%; }
  }
  @media (pointer: coarse) { .rp { width: 40px; height: 40px; font-size: 15px; } .bub.them .rp { right: -46px; } .bub.mine .rp { left: -46px; } .sys .rp { right: -20px; } }
  /* Touch screens: a message answers a tap (iPhone Safari passes a tap on plain text up to the page
     only when it is marked tappable), without the grey tap flash. */
  @media (hover: none) { .bub[data-mid], .sys[data-mid] { cursor: pointer; -webkit-tap-highlight-color: transparent; } }
  .bub.swiping::before, .sys.swiping::before { content: "\f3e5"; font-family: "Font Awesome 6 Free"; font-weight: 900; font-size: 12px; line-height: 1;
    position: absolute; left: -38px; top: 50%; translate: 0 -50%; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    background: var(--card); color: var(--ink2); box-shadow: 0 1px 2px rgba(0,0,0,.15); opacity: var(--rp, 0); scale: calc(.6 + .4 * var(--rp, 0)); }
  .bub.flash, .sys.flash { animation: flash 1.7s ease-out; }
  @keyframes flash { 0%, 35% { box-shadow: 0 0 0 3px var(--brand); } 100% { box-shadow: 0 0 0 0 transparent; } }
  .replybar { display: flex; align-items: center; gap: 6px; padding: 8px 10px 0; background: var(--card); border-top: 1px solid var(--border); }
  .replybar .rq { flex: 1; min-width: 0; padding: 6px 10px; border-left: 4px solid var(--brand); border-radius: 8px; background: var(--bg2); }
  .replybar .rq b { display: block; font-size: 12.5px; font-weight: 650; color: var(--brand-ink); }
  .replybar .rq span { display: block; font-size: 13px; color: var(--ink2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .replybar .x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink2); font-size: 16px; cursor: pointer; }
  .replybar .x:hover { background: var(--bg2); color: var(--ink); }
  .replybar:not([hidden]) + .compose { border-top: 0; }
  /* Requests (26 Nov 2026): one chat per set of people; each request a card, its talk in a side thread. */
  .thread .av.ini { font-weight: 700; font-size: 15px; letter-spacing: .02em; background: var(--brand-soft); color: var(--brand-ink); }
  .thread .wt { font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--brand); color: var(--on-brand, #fff); white-space: nowrap; }
  .rcard { align-self: center; width: min(560px, 100%); background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--border2, var(--border)); border-radius: 12px; padding: 10px 12px; margin: 6px 0; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.06); display: flex; flex-direction: column; gap: 6px; }
  .rcard.open { border-left-color: var(--brand); }
  .rcard.gone { opacity: .75; }
  .rcard > b { font-weight: 650; line-height: 1.35; }
  .rcard > small { color: var(--ink3); font-size: 12.5px; }
  .rc-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .rc-h .rc-t { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .rcard .q { padding: 6px 10px; border-left: 3px solid var(--border2, var(--border)); background: var(--bg2); border-radius: 6px; color: var(--ink2); font-size: 13.5px; }
  .rcard .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .rcard .acts:empty { display: none; }
  .rcard .qa-terms { margin: 0; }
  .rc-thread { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; min-height: 32px; color: var(--brand-ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .rc-thread:hover { text-decoration: underline; }
  .rc-thread:focus-visible, .sysreq:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
  .rcard.flash { animation: flash 1.7s ease-out; }
  button.sys.sysreq { border: 0; font: inherit; font-size: 12.5px; cursor: pointer; }
  button.sys.sysreq:hover { text-decoration: underline; }
  .pinned.waiting { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; background: var(--brand-soft); }
  .pinned.waiting .acts { margin: 0; margin-left: auto; }
  .pinned.waiting small { flex: 1 1 100%; color: var(--ink2); font-size: 12.5px; }
  #chat { position: fixed; }
  .rside { position: absolute; inset: 0 0 0 auto; width: min(440px, 100%); z-index: 6; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--border); box-shadow: -8px 0 24px rgba(0,0,0,.12); }
  .rside[hidden] { display: none; }
  .rside-h { display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--card); }
  .rside-h .t { flex: 1; min-width: 0; }
  .rside-h .t b { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rside-h .t small { display: block; color: var(--ink3); font-size: 12.5px; }
  .rside-h .x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink2); font-size: 16px; cursor: pointer; }
  .rside-h .x:hover { background: var(--bg2); color: var(--ink); }
  .rside-b { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px; background: light-dark(#EFEAE2, #0E1416); }
  .rside-b .rcard { width: 100%; margin-top: 0; }
  @media (min-width: 900px) { .rside-h #sideBack { display: none; } .rside-b .bub { max-width: 88%; } }
  @media (max-width: 899px) { .rside-h .x { display: none; } }
  @media (forced-colors: active) { .rcard.open { border-left-color: Highlight; } .thread .wt { border: 1px solid CanvasText; } }
  /* A laptop: the list on the left, the open conversation beside it (WhatsApp Web), not on top. */
  .split-empty { display: none; }
  @media (min-width: 900px) {
    body.rail-on .wrap { margin: 0; max-width: 420px; padding-left: 16px; }
    #chat, body.rail-on #chat { left: calc(var(--rail-w, 0px) + 436px); border-left: 1px solid var(--border); }
    body.rail-on.rail-min #chat { left: calc(var(--rail-w-min, 0px) + 436px); }
    body:not(.rail-on) #chat { left: 436px; }
    #chat #back { display: none; }
    .split-empty { display: grid; place-items: center; position: fixed; top: 0; bottom: 0; right: 0; left: calc(var(--rail-w, 0px) + 436px);
      color: var(--ink3); text-align: center; border-left: 1px solid var(--border); background: var(--bg2); padding: 24px; }
    body.rail-on.rail-min .split-empty { left: calc(var(--rail-w-min, 0px) + 436px); }
    body.chat-open .split-empty { display: none; }
    .msgs { padding: 16px 8%; }
    .sys { max-width: 560px; }
  }
</style>

<body>
<div id="appRoot">
  <header class="top">
    <button type="button" class="rail-toggle" data-rail-toggle aria-label="Show menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>Messages</h1>
    <button type="button" class="btn sm primary" id="newBtn"><i class="fa-solid fa-pen-to-square"></i> New</button>
  </header>
  <main class="wrap" id="main">
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="q" placeholder="Search conversations" aria-label="Search conversations"></div>
    <div class="chips" id="filters">
      <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-f="requests" aria-pressed="false">Requests</button>
      <button type="button" class="chip" data-f="property" aria-pressed="false">Properties</button>
      <button type="button" class="chip" data-f="lead" aria-pressed="false">Leads</button>
      <button type="button" class="chip" data-f="general" aria-pressed="false">General</button>
    </div>
    <div class="card" id="threads"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <div id="chat" hidden></div>
    <div class="split-empty" id="splitEmpty"><div><i class="fa-regular fa-comments" style="font-size:28px;opacity:.5"></i><p style="margin:8px 0 0">Pick a conversation on the left.</p><p class="note" style="margin:4px 0 0">Admins can read every team conversation.</p></div></div>
  </main>
</div>
<script src="shared-assets/appnav.js"></script>
<script src="shared-assets/install-app.js"></script>
<script type="module" src="shared-assets/access.js"></script>

</body>
</html>
