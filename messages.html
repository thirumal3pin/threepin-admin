<!DOCTYPE html>
<html lang="en" data-console="messages">
<head>
<script src="shared-assets/quota-notice.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Messages — 3 PIN Realty</title>
<link rel="preload" href="shared-assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shared-assets/fonts/inter.css">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<script>try{var t=localStorage.getItem('crmTheme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="shared-assets/appnav.css">
<link rel="stylesheet" href="shared-assets/agent-ui.css">
<style>
  .thread { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--border); cursor: pointer; align-items: center; min-height: 68px; }
  .thread:first-child { border-top: 0; }
  .thread:active { background: var(--bg2); }
  .thread .av { width: 42px; height: 42px; }
  .thread .bd { flex: 1; min-width: 0; }
  .thread .bd b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .bd small { display: block; color: var(--ink3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread .side { flex: none; text-align: right; font-size: 12px; color: var(--ink3); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .thread.unread .bd b, .thread.unread .side { color: var(--ink); }
  .thread .ub { width: 12px; height: 12px; border-radius: 50%; background: #25D366; display: block; }
  /* Chat */
  body.chat-open .wrap { padding-bottom: 0; }
  #chat { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; }
  @media (min-width: 900px) { body.rail-on #chat { left: var(--rail-w); } body.rail-on.rail-min #chat { left: var(--rail-w-min); } }
  .chat-h { display: flex; align-items: center; gap: 10px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--card); }
  .chat-h .t { flex: 1; min-width: 0; }
  .chat-h .t b { display: block; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-h .t small { display: block; color: var(--ink3); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-h a.t { color: inherit; text-decoration: none; }
  .pinned { padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--bg2); font-size: 13.5px; }
  .pinned .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 4px;
    background: light-dark(#EFEAE2, #0E1416); }
  .day { align-self: center; font-size: 12px; color: var(--ink2); background: var(--card); padding: 4px 10px; border-radius: 8px; margin: 8px 0; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
  .bub { max-width: min(78%, 520px); padding: 6px 10px 4px; border-radius: 10px; font-size: 14.5px; line-height: 1.38; box-shadow: 0 1px 1px rgba(0,0,0,.08);
    white-space: pre-wrap; overflow-wrap: anywhere; position: relative; }
  .bub.them { align-self: flex-start; background: var(--card); border-top-left-radius: 2px; }
  .bub.mine { align-self: flex-end; background: light-dark(#D9FDD3, #144D37); border-top-right-radius: 2px; }
  .bub .by { display: block; font-size: 12px; font-weight: 650; color: var(--brand-ink); margin-bottom: 1px; }
  .bub .meta { display: block; text-align: right; font-size: 11px; color: var(--ink3); margin-top: 2px; }
  .bub .meta .tick.read { color: #34B7F1; }
  .sys { align-self: center; max-width: 88%; text-align: center; font-size: 12.5px; color: var(--ink2); background: light-dark(#FFF6D6, #2A2614); padding: 6px 10px; border-radius: 8px; margin: 4px 0; }
  .compose { display: flex; gap: 8px; align-items: flex-end; padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--card); }
  .compose textarea { min-height: 44px; max-height: 140px; border-radius: 22px; padding: 11px 16px; resize: none; }
  .compose .send { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 0; background: #25D366; color: #06240F; font-size: 18px; cursor: pointer; }
  .compose .send:disabled { opacity: .5; }
  /* Typing with the keyboard up: the pinned card folds to one line, the messages keep the room. */
  #chat:focus-within .pinned .acts, #chat:focus-within .pinned > div:not(.acts) { display: none; }
  .bub.mine .meta { color: light-dark(#5C6E59, #B9D4C2); }
  .readonly-note { padding: 8px 12px; font-size: 12.5px; background: light-dark(#FFF7E0, rgba(255,190,40,.12)); color: light-dark(#6B4600, #FFD27A); border-bottom: 1px solid var(--border); }
  /* A laptop: the list on the left, the open conversation beside it (WhatsApp Web), not on top. */
  .split-empty { display: none; }
  @media (min-width: 900px) {
    body.rail-on .wrap { margin: 0; max-width: 420px; padding-left: 16px; }
    #chat { left: calc(var(--rail-w, 0px) + 436px); border-left: 1px solid var(--border); }
    body.rail-on.rail-min #chat { left: calc(var(--rail-w-min, 0px) + 436px); }
    body:not(.rail-on) #chat { left: 436px; }
    #chat #back { display: none; }
    .split-empty { display: grid; place-items: center; position: fixed; top: 0; bottom: 0; right: 0; left: calc(var(--rail-w, 0px) + 436px);
      color: var(--ink3); text-align: center; border-left: 1px solid var(--border); background: var(--bg2); padding: 24px; }
    body.rail-on.rail-min .split-empty { left: calc(var(--rail-w-min, 0px) + 436px); }
    body.chat-open .split-empty { display: none; }
    .msgs { padding: 16px 8%; }
    .sys { max-width: 560px; }
  }
</style>
<link rel="stylesheet" href="shared-assets/theme.css">
</head>
<body>
<div id="appRoot">
  <header class="top">
    <button type="button" class="rail-toggle" data-rail-toggle aria-label="Show menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>Messages</h1>
    <button type="button" class="btn sm primary" id="newBtn"><i class="fa-solid fa-pen-to-square"></i> New</button>
  </header>
  <main class="wrap" id="main">
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="q" placeholder="Search conversations" aria-label="Search conversations"></div>
    <div class="chips" id="filters">
      <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-f="access_request" aria-pressed="false">Approvals</button>
      <button type="button" class="chip" data-f="property" aria-pressed="false">Properties</button>
      <button type="button" class="chip" data-f="lead" aria-pressed="false">Leads</button>
      <button type="button" class="chip" data-f="general" aria-pressed="false">General</button>
    </div>
    <div class="card" id="threads"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
    <div id="chat" hidden></div>
    <div class="split-empty" id="splitEmpty"><div><i class="fa-regular fa-comments" style="font-size:28px;opacity:.5"></i><p style="margin:8px 0 0">Pick a conversation on the left.</p><p class="note" style="margin:4px 0 0">Admins can read every team conversation.</p></div></div>
  </main>
</div>
<script src="shared-assets/appnav.js"></script>
<script src="shared-assets/install-app.js"></script>
<script type="module" src="shared-assets/access.js"></script>
<script type="module" src="messages-assets/messages.js"></script>
</body>
</html>
