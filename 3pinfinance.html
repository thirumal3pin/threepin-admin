<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF8">
<meta name="robots" content="noindex, nofollow">
<title>Finance — 3 PIN Realty</title>

<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Serif&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="finance-assets/style.css">
<link rel="stylesheet" href="shared-assets/appnav.css">
<script src="shared-assets/appnav.js" defer></script>

<!-- The Firebase modules are fetched on load; preconnecting shaves a round trip off a cold
     open on a phone, which is where this page is mostly used. -->
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ═══════ LOGIN ═══════
     Same Firebase project, tenant and accounts as crm.html and dashboard.html — the same
     email and password work here. -->
<div class="login" id="loginScreen">
  <form class="login-card" onsubmit="return financeAttemptLogin(event)">
    <img class="mark" src="logo.jpg" alt="" width="60" height="60">
    <h1>3 PIN Realty Finance</h1>
    <p class="lead">Sign in with your admin account.</p>
    <div class="login-err" id="loginErr" role="alert"></div>
    <div class="field">
      <label for="loginUser">Email</label>
      <input type="email" id="loginUser" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </div>
    <button class="btn primary block" type="submit">Sign in</button>
  </form>
</div>

<!-- ═══════ APP ═══════ -->
<div id="appRoot" style="display:none">

  <header class="top">
    <button type="button" class="rail-toggle" data-rail-toggle aria-label="Show menu"></button>
    <div class="brand"><img src="logo.jpg" alt="3 PIN Realty" width="30" height="30">3 PIN Realty <span class="small">Finance</span></div>
    <div class="spacer"></div>
    <!-- Who is signed in, and Sign out, are in the rail now — one place for
         them, the same place on every console. -->
    <span class="who" id="whoami" hidden></span>
    <div class="cur-tog scope-tog" id="scopeTog" role="group" aria-label="Which record" title="The cash box is kept as its own record. Show both together, or read either one on its own — each is complete, with its own income, costs and receivables. Lasts for this tab.">
      <span class="lbl">Record</span>
      <button type="button" data-scope="with" class="on" aria-pressed="true" onclick="fin.setScope('with')">Both</button>
      <button type="button" data-scope="without" aria-pressed="false" onclick="fin.setScope('without')">Bank</button>
      <button type="button" data-scope="only" aria-pressed="false" onclick="fin.setScope('only')">Cash</button>
    </div>
    <div class="cur-tog" id="curTog" role="group" aria-label="Display currency">
      <button type="button" data-cur="INR" class="on" aria-pressed="true" onclick="fin.setCurrency('INR')">INR</button>
      <button type="button" data-cur="USD" aria-pressed="false" onclick="fin.setCurrency('USD')">USD</button>
    </div>
  </header>

  <!-- The side nav that used to sit here is now the app rail, which carries
       these same five groups plus the other consoles. One menu, the same one
       on every page. -->
  <div class="shell">
    <main id="main" tabindex="-1"></main>
  </div>

  <!-- The phone keeps its tab bar: four things done all day, and Record as the
       one that creates something. "More" opens the rail rather than a second
       sheet listing the same pages a different way. -->
  <nav class="bottom" id="bottomnav" aria-label="Sections"></nav>

  <!-- The phone's preview of what saving will do: the Record screen's preview card is moved in
       here on open and back on close, so there is exactly one preview to keep right. -->
  <div class="sheet pv-sheet" id="pvSheet" onclick="if(event.target===this) fin.closePreview()">
    <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="pvTitle">
      <div class="sheet-head"><h3 id="pvTitle" tabindex="-1">What saving this does</h3><button class="btn ghost sm" type="button" aria-label="Close" onclick="fin.closePreview()"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
      <div id="pvHost"></div>
      <div class="sheet-foot"><button class="btn" type="button" onclick="fin.closePreview()">Back</button><div class="spacer"></div><button class="btn primary js-save" type="button" onclick="fin.save()" disabled>Save</button></div>
    </div>
  </div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this) financeCloseModal()"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="finance-assets/app.js"></script>
</body>
</html>
