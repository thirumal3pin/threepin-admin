<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FE8D00">
<meta name="robots" content="noindex, nofollow">
<title>Finance — 3 PIN Realty</title>

<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="finance-assets/style.css">

<!-- The Firebase modules are fetched on load; preconnecting shaves a round trip off a cold
     open on a phone, which is where this page is mostly used. -->
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<!-- ═══════ LOGIN ═══════
     Same Firebase project, tenant and accounts as crm.html and dashboard.html — the same
     email and password work here. -->
<div class="login" id="loginScreen">
  <form class="login-card" onsubmit="return financeAttemptLogin(event)">
    <div class="mark" aria-hidden="true">3</div>
    <h1>3 PIN Realty Finance</h1>
    <p class="lead">Sign in with your admin account.</p>
    <div class="login-err" id="loginErr" role="alert"></div>
    <div class="field">
      <label for="loginUser">Email</label>
      <input type="email" id="loginUser" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="loginPass">Password</label>
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </div>
    <button class="btn primary block" type="submit">Sign in</button>
  </form>
</div>

<!-- ═══════ APP ═══════ -->
<div id="appRoot" style="display:none">

  <header class="top">
    <div class="brand"><i aria-hidden="true">3</i>3 PIN Realty <span class="muted small" style="font-weight:500">Finance</span></div>
    <div class="spacer"></div>
    <span class="who" id="whoami"></span>
    <button class="btn ghost sm" type="button" onclick="financeLogout()">Sign out</button>
  </header>

  <div class="shell">
    <nav class="side" id="sidenav" aria-label="Sections"></nav>
    <main id="main" tabindex="-1"></main>
  </div>

  <nav class="bottom" id="bottomnav" aria-label="Sections"></nav>

  <!-- The "More" sheet carries the tabs that do not fit across the bottom bar on a phone. -->
  <div class="sheet" id="moreSheet" onclick="if(event.target===this) financeCloseSheet()">
    <div class="sheet-inner" role="dialog" aria-modal="true" aria-label="More sections">
      <h3>All sections</h3>
      <div class="sheet-grid" id="sheetGrid"></div>
    </div>
  </div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this) financeCloseModal()"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="finance-assets/app.js"></script>
</body>
</html>
