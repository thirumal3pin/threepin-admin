<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Properties — 3 PIN Realty</title>
<meta name="robots" content="noindex, nofollow">
<script>
  // An agent's Properties is the Property dashboard now, from their own copy of the inventory
  // (dashboard-assets/agent-mode.js). Old links and bookmarks land there — at the same property when
  // the link named one.
  (function () {
    var id = null;
    try { id = new URLSearchParams(location.search).get('id'); } catch (e) {}
    location.replace('dashboard.html' + (id ? '?property=' + encodeURIComponent(id) : ''));
  })();
</script>
</head>
<body><p style="font:15px system-ui;padding:24px"><a href="dashboard.html">Open Properties</a></p></body>
</html>
