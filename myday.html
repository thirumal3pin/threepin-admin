<!DOCTYPE html>
<html lang="en" data-console="myday">
<head>
<script src="shared-assets/quota-notice.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My Day — 3 PIN Realty</title>
<link rel="preload" href="shared-assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shared-assets/fonts/inter.css">
<link rel="icon" type="image/jpeg" href="logo.jpg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="3 PIN">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script>try{var t=localStorage.getItem('crmTheme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="shared-assets/appnav.css">
<link rel="stylesheet" href="shared-assets/agent-ui.css">
<link rel="stylesheet" href="shared-assets/agent-matches.css">
<style>
  .hello { margin: 2px 4px 14px; }
  .hello b { font-size: 20px; letter-spacing: -.01em; display: block; }
  .hello small { color: var(--ink3); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; margin-bottom: 6px; }
  .who-sel select { max-width: 320px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; text-align: center; text-decoration: none; color: inherit; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--ink3); font-size: 11.5px; line-height: 1.2; display: block; }
  .stat.hot b { color: var(--brand-ink); }
  /* Approvals: select several, decide together (26 Nov 2026). */
  .linkbtn { border: 0; background: none; padding: 6px 4px; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; }
  .linkbtn:focus-visible, .pick input:focus-visible, .bulk-all input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .item .pick { flex: none; width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; }
  .item .pick input, .bulk-all input { width: 20px; height: 20px; accent-color: var(--brand); cursor: pointer; margin: 0; }
  .item.picked { background: var(--brand-soft); }
  .bulk { position: sticky; top: var(--top-h, 60px); z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; background: var(--card); border-bottom: 1px solid var(--border); border-radius: 12px 12px 0 0; }
  .bulk .acts { margin: 0; margin-left: auto; }
  .bulk .qa-terms { flex: 1 1 100%; margin: 0; }
  .bulk .rj { flex: 1 1 100%; }
  .bulk-all { display: inline-flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; min-height: 36px; }
  .bulk + .item { border-top: 0; }
  /* While selecting, the bar decides: each card keeps only Message (and its tick box). */
  .selecting .item [data-quick], .selecting .item [data-reject], .selecting .item [data-decide], .selecting .item > .bd > .qa-terms { display: none; }
  .selecting .item { cursor: default; }
  @media (forced-colors: active) { .item.picked { outline: 2px solid Highlight; outline-offset: -2px; } }
</style>
<link rel="stylesheet" href="shared-assets/theme.css">
</head>
<body>
<div id="appRoot">
  <header class="top">
    <button type="button" class="rail-toggle" data-rail-toggle aria-label="Show menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <h1>My Day</h1>
    
  </header>
  <main class="wrap" id="main">
    <div class="who-sel" id="whoSel" hidden><label for="who" class="note" style="margin:0">Day of</label><select id="who" aria-label="Whose day"></select></div>
    <div class="hello" id="hello"></div>
    <div class="seg" role="tablist" id="tabs">
      <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
    </div>
    <div id="tab-today">
      <div class="stats" id="stats"></div>
      <div id="sections"><div class="card"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div>
    </div>
    <div id="tab-history" hidden>
      <div class="chips" id="histRange">
        <button type="button" class="chip" data-r="7" aria-pressed="true">7 days</button>
        <button type="button" class="chip" data-r="30" aria-pressed="false">30 days</button>
        <button type="button" class="chip" data-r="0" aria-pressed="false">All time</button>
      </div>
      <div class="chips" id="histKind">
        <button type="button" class="chip" data-k="all" aria-pressed="true">Everything</button>
        <button type="button" class="chip" data-k="given" aria-pressed="false">I decided</button>
        <button type="button" class="chip" data-k="mine" aria-pressed="false">I asked</button>
      </div>
      <div class="card" id="history"></div>
    </div>
  </main>
</div>
<script src="shared-assets/appnav.js"></script>
<script src="shared-assets/install-app.js"></script>
<script type="module" src="shared-assets/access.js"></script>
<script type="module" src="myday-assets/myday.js"></script>
</body>
</html>
