<style>

  .btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)} .btn.sm{padding:5px 10px;font-size:13px;border-radius:6px} .btn.danger{color:var(--out)}
  .shell{display:grid;grid-template-columns:196px 1fr;min-height:calc(100vh - 51px)}

  nav.side button.on{background:var(--paper);color:var(--ink)}
  main{padding:20px;max-width:1120px;width:100%}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px} h2{font-size:17px;font-weight:700;margin:22px 0 10px} h3{font-size:15px;font-weight:700;margin:0 0 6px}
  p.lead{color:var(--ink2);margin:0 0 16px;max-width:66ch}
  .grid{display:grid;gap:12px} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
  .stat .l{font-size:13px;color:var(--mute);font-weight:600} .stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em} .stat .s{font-size:12px;color:var(--mute)}
  .in{color:var(--in)} .out{color:var(--out)}
  table{width:100%;border-collapse:collapse;font-size:14px} th{text-align:left;font-weight:600;color:var(--mute);font-size:12.5px;padding:8px;border-bottom:1px solid var(--line)} td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.n,th.n{text-align:right;white-space:nowrap} tr.total td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0} tr.sub td{color:var(--ink2)} tr.click{cursor:pointer} tr.click:hover td{background:var(--paper)}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:#eee;color:#666} .pill.in{background:var(--in-soft);color:var(--in)} .pill.out{background:var(--out-soft);color:var(--out)} .pill.or{background:var(--orange-soft);color:var(--orange-ink)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
  .muted{color:var(--mute)} .small{font-size:13px} .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#eee;color:#555;margin-left:4px}

  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px} .toolbar select,.toolbar input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff}
  .rev{text-decoration:line-through;color:var(--mute)}

  .modal{background:var(--white);border-radius:14px;width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr}

  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px} .field label{font-size:13px;font-weight:600;color:var(--ink2)}
  .field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;width:100%} .field input:focus,.field select:focus{outline:2px solid var(--orange);outline-offset:1px;border-color:var(--orange)}
  .field .hint{font-size:12px;color:var(--mute)}
  .when{background:var(--orange-soft);border:1px solid #ffd9a8;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:12px} .when b{color:var(--orange-ink)}
  .effects{margin:0;padding-left:18px} .effects li{margin:5px 0}
  .journal{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px} .jl{display:flex;justify-content:space-between;gap:10px;padding:3px 0} .jl.cr{padding-left:22px;color:var(--ink2)} .jl.bad{color:var(--out);font-weight:700} .journal summary{cursor:pointer;color:var(--mute);font-size:12px}
  .chooser{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px} .chooser button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px} .chooser button b{display:block;font-size:14px} .chooser .eh{grid-column:1/-1;font-size:12px;color:var(--mute);font-weight:700;margin-top:8px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none} .toast.show{opacity:1}
  .steps{display:flex;gap:4px;font-size:12px;font-weight:700} .steps span{flex:1;padding:6px 4px;text-align:center;background:#eee;color:#888;border-radius:6px} .steps span.on{background:var(--orange);color:#fff} .steps span.done{background:var(--in-soft);color:var(--in)}
  .bar{height:7px;border-radius:4px;background:var(--in)} .bar.o{background:var(--out)}
  .bottom{display:none}
  @media (max-width:860px){ .shell{grid-template-columns:1fr} nav.side{display:none} .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:20} .bottom button{flex:1;border:0;background:none;padding:10px 4px;font-size:12px;font-weight:700;color:var(--mute)} .bottom button.on{color:var(--orange)} main{padding:14px 14px 80px} .g2,.g3,.g4,.modal,.chooser{grid-template-columns:1fr} .modal .form{border-right:0} .modal .side{border-radius:0 0 14px 14px} .hide-m{display:none} h1{font-size:21px} .ov{padding:8px} }

<script>
/* 3 PIN REALTY — FINANCE SYSTEM (prototype v2)
   Deal-centric. One action → one balanced journal underneath. Views are derived.
   Data is in memory: Export / Import to keep it. */

const ACCOUNTS=[['1000','Bank','asset'],['1010','Petty cash','asset'],['1100','Receivable from clients','asset'],['1150','TDS receivable (deducted by clients)','asset'],['1200','Prepaid expenses','asset'],['1300','Fixed assets','asset'],['1350','Accumulated depreciation','asset'],['1400','GST input credit','asset'],['1500','Advances to staff','asset'],
 ['2000','Payable to vendors & partners','liability'],['2100','Advances held from clients','liability'],['2200','GST payable','liability'],['2250','TDS payable','liability'],['2300','Credit card','liability'],['2400','Loans','liability'],['2450',"Director's account",'liability'],['2550','Statutory deductions payable','liability'],
 ['3000','Share capital','equity'],
 ['4000','Brokerage — seller side','income'],['4010','Brokerage — buyer side','income'],['4020','Consultancy income','income'],['4030','Forfeited advances','income'],['4040','Other income','income'],['4050','Bad debts recovered','income'],
 ['5000','Rent','expense'],['5010','Salaries','expense'],['5020','Bonus & incentives','expense'],['5030','Staff welfare & food','expense'],['5040','Partner commission (Realtor Club)','expense'],['5045','Deal costs (EC, patta, legal, docs)','expense'],['5050','Conveyance & fuel','expense'],['5060','Electricity','expense'],['5070','Internet & phone','expense'],['5080','Software & subscriptions','expense'],['5090','Advertising & marketing','expense'],['5100','Printing & stationery','expense'],['5110','Photography & video','expense'],['5120','Professional fees (CA, legal)','expense'],['5130','Repairs & maintenance','expense'],['5140','Bank & card charges','expense'],['5150','Interest & finance cost','expense'],['5160','Rates, taxes & filing fees','expense'],['5170','Insurance','expense'],['5180','Miscellaneous','expense'],['5190','Bad debts written off','expense'],['5200','Depreciation','expense'],['5210','Subscription cancellation loss','expense']
].map(([code,name,type])=>({code,name,type}));
const A=Object.fromEntries(ACCOUNTS.map(a=>[a.code,a]));
const EXP=ACCOUNTS.filter(a=>a.type==='expense'&&!['5190','5200','5210','5150','5040'].includes(a.code));
const PAY_VIA=[['1000','Bank / UPI'],['2300','Credit card'],['1010','Petty cash']];
const TDS=[['none','No TDS',0],['194H','194H — Commission / brokerage',2],['194J','194J — Professional fees',10],['194I','194I — Rent',10],['194C','194C — Contractor',2]];

let S=blank(); function blank(){return {parties:[],deals:[],txns:[],subs:[],loans:[],assets:[],monthEnds:{},seq:1};}
const nid=p=>p+String(S.seq++).padStart(4,'0'); const today=()=>new Date().toISOString().slice(0,10); const ym=d=>d.slice(0,7);
const addMonths=(y,n)=>{const [a,b]=y.split('-').map(Number);const d=new Date(a,b-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');};
const mlabel=y=>new Date(y+'-01').toLocaleString('en-IN',{month:'short',year:'numeric'});
const fmt=n=>{const neg=n<0;n=Math.abs(Math.round(n));let s=String(n);if(s.length>3)s=s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+s.slice(-3);return (neg?'−':'')+'₹'+s;};
const num=v=>Number(v)||0; const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const party=id=>S.parties.find(p=>p.id===id); const pname=id=>party(id)?.name||'—';
function ensureParty(name,type){ if(!name) return null; let p=S.parties.find(x=>x.name.toLowerCase()===String(name).trim().toLowerCase()); if(!p){p={id:nid('P'),name:String(name).trim(),type:type||'other'};S.parties.push(p);} return p.id; }
const deal=id=>S.deals.find(d=>d.id===id);

function post(t){ const dr=t.lines.reduce((s,l)=>s+num(l.dr),0),cr=t.lines.reduce((s,l)=>s+num(l.cr),0); if(Math.abs(dr-cr)>0.5) throw new Error('Entry does not balance ('+fmt(dr)+' vs '+fmt(cr)+')'); if(!t.lines.length) throw new Error('Nothing to post'); t.id=t.id||nid('TX'); S.txns.push(t); return t; }
function reverse(id){ const t=S.txns.find(x=>x.id===id); if(!t||t.reversedBy) return; const r=post({date:today(),event:'reverse',desc:'Reversal — '+t.desc,lines:t.lines.map(l=>({...l,dr:l.cr,cr:l.dr})),reversalOf:t.id}); t.reversedBy=r.id; toast('Reversed — both entries stay on record'); render(); }
function bal(code,f={}){ let s=0; for(const t of S.txns){ if(f.upto&&t.date>f.upto) continue; for(const l of t.lines){ if(l.acc!==code) continue; if(f.party&&l.party!==f.party) continue; if(f.deal&&l.deal!==f.deal) continue; s+=num(l.dr)-num(l.cr);} } const ty=A[code].type; return (ty==='asset'||ty==='expense')?s:-s; }
function byParty(code){ const m={}; const ty=A[code].type; for(const t of S.txns) for(const l of t.lines) if(l.acc===code&&l.party) m[l.party]=(m[l.party]||0)+((ty==='asset'||ty==='expense')?1:-1)*(num(l.dr)-num(l.cr)); return m; }
function pl(month,dealId){ const inc={},exp={}; for(const t of S.txns){ if(month&&ym(t.date)!==month) continue; for(const l of t.lines){ if(dealId&&l.deal!==dealId) continue; const a=A[l.acc]; if(a.type==='income') inc[l.acc]=(inc[l.acc]||0)+num(l.cr)-num(l.dr); if(a.type==='expense') exp[l.acc]=(exp[l.acc]||0)+num(l.dr)-num(l.cr);} } const ti=Object.values(inc).reduce((a,b)=>a+b,0),te=Object.values(exp).reduce((a,b)=>a+b,0); return {inc,exp,ti,te,profit:ti-te}; }
function schedule(P,rate,n,startYM){ const r=rate/1200; const emi=r?P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):P/n; let b=P,out=[]; for(let i=1;i<=n;i++){const int=b*r;let prin=emi-int;if(i===n)prin=b;b-=prin;out.push({n:i,month:addMonths(startYM,i-1),emi:Math.round(prin+int),int:Math.round(int),prin:Math.round(prin),bal:Math.round(Math.max(b,0))});} return out; }
function prepaidLeft(s){ return Math.max(0,s.amount-s.amortized.length*s.monthly); }
function dealFigures(d){ const p=pl(null,d.id); const tokens=bal('2100',{deal:d.id}); const recv=bal('1100',{deal:d.id}); const comm=p.exp['5040']||0; const costs=p.te-comm; return {income:p.ti,costs,comm,net:p.profit,tokens,recv,expected:num(d.expSeller)+num(d.expBuyer)}; }

// ============================================================ ACTIONS
const F=(k,label,type='text',x={})=>({k,label,type,...x});
const dealOpts=()=>S.deals.filter(d=>!['dropped','closed'].includes(d.status)).map(d=>[d.id,d.property]);
const sideParty=(d,side)=>side==='seller'?d.seller:d.buyer;
function partySides(dealId){ const d=deal(dealId); if(!d) return []; const o=[]; if(d.seller) o.push(['seller','Seller — '+pname(d.seller)]); if(d.buyer) o.push(['buyer','Buyer — '+pname(d.buyer)]); return o; }
const EV={};

/* ---- DEALS ---- */
EV.newdeal={title:'New deal',when:'Open a deal as soon as you have a property and a client. Everything for it — tokens, costs, invoices, partner share — links here. Expected brokerage is your <b>estimate</b>; actual comes from invoices.',
 fields:()=>[F('date','Date','date',{def:today()}),F('property','Property','text',{hint:'e.g. 2BHK, Nungambakkam — Sunrise Apts'}),F('seller','Seller name','text'),F('buyer','Buyer name','text',{hint:'Leave blank until you have one'}),F('expSeller','Expected brokerage from seller','number',{def:0}),F('expBuyer','Expected brokerage from buyer','number',{def:0})],
 build:v=>({desc:'',lines:[],effects:[`Deal "${esc(v.property||'…')}" opens in the pipeline with expected brokerage <b>${fmt(num(v.expSeller)+num(v.expBuyer))}</b>. Nothing hits the books until money or a bill moves.`],after:()=>{const id=nid('D'); S.deals.push({id,property:v.property,seller:ensureParty(v.seller,'client'),buyer:ensureParty(v.buyer,'client'),expSeller:num(v.expSeller),expBuyer:num(v.expBuyer),status:'open',opened:v.date}); return id;}})};
EV.token={title:'Token / advance received',when:'Money received <b>before</b> registration is not income. It is held for the client and shows on this deal until it is adjusted, refunded or forfeited.',
 fields:v=>[F('date','Date','date',{def:today()}),F('deal','Deal','select',{opts:dealOpts()}),F('from','From','select',{opts:partySides(v.deal)}),F('amt','Amount','number'),F('via','Received into','select',{opts:[['1000','Bank / UPI'],['1010','Petty cash']]})],
 build:v=>{const d=deal(v.deal); if(!d) return {desc:'',lines:[],effects:['Pick a deal.']}; const pid=sideParty(d,v.from); if(!pid) return {desc:'',lines:[],effects:['This deal has no '+v.from+' yet.']}; return {desc:`Token — ${d.property} (${pname(pid)})`,lines:[{acc:v.via,dr:num(v.amt)},{acc:'2100',cr:num(v.amt),party:pid,deal:d.id}],effects:[`Cash in ${fmt(num(v.amt))}, held for ${pname(pid)} on this deal. <b>Not income.</b> Profit unchanged.`],after:()=>{if(d.status==='open')d.status='token';}};}};
EV.dealcost={title:'Cost for this deal',when:'EC, patta, legal, documentation, travel. Choose who bears it: <b>you</b> (a deal expense) or the <b>client</b> (you paid on their behalf — it sits as recoverable from them and goes onto their settlement).',
 fields:v=>[F('date','Date','date',{def:today()}),F('deal','Deal','select',{opts:dealOpts()}),F('what','What','text',{hint:'EC extract, patta transfer, lawyer opinion, site travel…'}),F('amt','Amount','number'),F('bear','Who bears it','select',{opts:[['self','Company (deal expense)'],['seller','Recover from seller'],['buyer','Recover from buyer']]}),F('acc','Expense category','select',{opts:[['5045','Deal costs (EC, patta, legal)'],['5050','Conveyance & fuel'],['5110','Photography & video'],['5120','Professional fees'],['5180','Miscellaneous']],show:v=>v.bear==='self'}),F('how','Paid','select',{opts:[['1000','Now — Bank / UPI'],['1010','Now — Petty cash'],['2300','Now — Credit card'],['bill','Bill received, pay vendor later']]}),F('vendor','Vendor','text',{show:v=>v.how==='bill'})],
 build:v=>{const d=deal(v.deal); if(!d) return {desc:'',lines:[],effects:['Pick a deal.']}; const amt=num(v.amt); const lines=[]; const eff=[];
  if(v.bear==='self'){ lines.push({acc:v.acc||'5045',dr:amt,deal:d.id}); eff.push(`Deal expense ${fmt(amt)} — reduces this deal's net and this month's profit.`);} else { const pid=sideParty(d,v.bear); if(!pid) return {desc:'',lines:[],effects:['This deal has no '+v.bear+' yet — add one on the deal page or choose "Company".']}; lines.push({acc:'1100',dr:amt,party:pid,deal:d.id}); eff.push(`${fmt(amt)} paid on behalf of ${pname(pid)} — <b>recoverable</b>, not your expense. It will appear on their settlement and in your chase list.`);}
  if(v.how==='bill'){ lines.push({acc:'2000',cr:amt,party:ensureParty(v.vendor||'Vendor','vendor')}); eff.push(`You owe ${esc(v.vendor||'vendor')} ${fmt(amt)} — in payables.`);} else lines.push({acc:v.how,cr:amt});
  return {desc:`${v.what||'Deal cost'} — ${d.property}`,lines,effects:eff};}};
EV.absorb={title:'Recoverable cost not recovered — absorb it',when:'You paid something for the client and they won\'t pay it back. Move it from "recoverable" to your own deal expense.',
 fields:v=>[F('date','Date','date',{def:today()}),F('deal','Deal','select',{opts:S.deals.filter(d=>bal('1100',{deal:d.id})>0.5).map(d=>[d.id,d.property])}),F('from','Client','select',{opts:partySides(v.deal),hint:v=>{const d=deal(v.deal);const p=d&&sideParty(d,v.from);return p?'Owed by them on this deal: '+fmt(bal('1100',{party:p,deal:v.deal})):'';}}),F('amt','Amount to absorb','number')],
 build:v=>{const d=deal(v.deal); if(!d) return {desc:'',lines:[],effects:['Pick a deal.']}; const pid=sideParty(d,v.from); return {desc:`Absorbed cost — ${d.property}`,lines:[{acc:'5045',dr:num(v.amt),deal:d.id},{acc:'1100',cr:num(v.amt),party:pid,deal:d.id}],effects:[`${fmt(num(v.amt))} becomes your deal expense. Receivable from ${pname(pid)} drops.`]};}};
EV.invoice={title:'Deal registered — raise brokerage invoice',when:'The deal registered. <b>Now</b> income is earned. Tokens held convert to income; recoverable costs are added to what the client owes; TDS the client deducts is parked as your claim.',

 build:v=>({desc:`${v.desc||A[v.acc].name} (paid by director)`,lines:[{acc:v.acc,dr:num(v.amt)},{acc:'2450',cr:num(v.amt)}],effects:[`Cost ${fmt(num(v.amt))}. Company owes director ${fmt(num(v.amt))}.`]})};

/* ---- MONEY IN / FUNDING / LOANS ---- */
EV.otherinc={title:'Other income',when:'Interest, referral fee, anything earned that isn\'t a deal.',
 fields:()=>[F('date','Date','date',{def:today()}),F('desc','What','text'),F('acc','Type','select',{opts:[['4040','Other income'],['4020','Consultancy income'],['4050','Bad debt recovered']]}),F('amt','Amount','number')],
 build:v=>({desc:v.desc||A[v.acc].name,lines:[{acc:'1000',dr:num(v.amt)},{acc:v.acc,cr:num(v.amt)}],effects:[`Income ${fmt(num(v.amt))} this month.`]})};
EV.funding={title:'Capital / director loan received',when:'<b>Never income.</b> Share capital = ownership; director loan = repayable.',
 fields:()=>[F('date','Date','date',{def:today()}),F('kind','Kind','select',{opts:[['3000','Share capital'],['2450',"Director's loan"]]}),F('who','From','text'),F('amt','Amount','number')],
 build:v=>({desc:`${A[v.kind].name} — ${v.who}`,lines:[{acc:'1000',dr:num(v.amt)},{acc:v.kind,cr:num(v.amt)}],effects:[`Bank up ${fmt(num(v.amt))}. Profit unchanged.`,v.kind==='3000'?'Board resolution + ROC filing — tell your CA.':'Repayable to the director.']})};
EV.bankloan={title:'Bank / NBFC loan (EMI)',when:'Creates the loan with its month-by-month principal/interest schedule.',
 fields:()=>[F('date','Date','date',{def:today()}),F('lender','Lender','text'),F('purpose','Purpose','text'),F('amt','Amount','number'),F('rate','Interest % p.a.','number',{def:12}),F('n','Tenure (months)','number',{def:24}),F('fee','Processing fee','number',{def:0})],
 build:v=>{const amt=num(v.amt),fee=num(v.fee),n=Math.max(1,num(v.n)); const pid=ensureParty(v.lender||'Lender','lender'); const lines=[{acc:'1000',dr:amt-fee},{acc:'2400',cr:amt,party:pid}]; if(fee)lines.push({acc:'5150',dr:fee}); const sch=schedule(amt,num(v.rate),n,addMonths(ym(v.date||today()),1));
  return {desc:`Loan — ${v.lender} (${v.purpose})`,lines,effects:[`Bank up ${fmt(amt-fee)}. Loan ${fmt(amt)}. <b>Not income.</b>`,`EMI ≈ ${fmt(sch[0].emi)} × ${n}. Total interest: <b>${fmt(sch.reduce((s,x)=>s+x.int,0))}</b>.`],after:()=>S.loans.push({id:nid('L'),lender:v.lender,purpose:v.purpose,principal:amt,rate:num(v.rate),n,schedule:sch,paid:[],status:'active',party:pid})};}};
EV.emi={title:'Pay EMI',when:'Principal returns borrowed money (not a cost). Only interest is a cost. Split comes from the schedule.',
 fields:()=>[F('date','Date','date',{def:today()}),F('loan','Loan','select',{opts:S.loans.filter(l=>l.status==='active').map(l=>[l.id,`${l.lender} — ${l.purpose}`])}),F('extra','Late fee / penalty','number',{def:0})],
 build:v=>{const l=S.loans.find(x=>x.id===v.loan); if(!l) return {desc:'',lines:[],effects:['No active loan.']}; const i=l.schedule.find(s=>!l.paid.includes(s.n)); if(!i) return {desc:'',lines:[],effects:['Fully paid.']}; const x=num(v.extra); const lines=[{acc:'2400',dr:i.prin,party:l.party},{acc:'5150',dr:i.int},{acc:'1000',cr:i.emi+x}]; if(x)lines.push({acc:'5140',dr:x});
  return {desc:`EMI ${i.n}/${l.n} — ${l.lender}`,lines,effects:[`Cash out ${fmt(i.emi+x)}. Cost this month: <b>${fmt(i.int)} interest</b>${x?' + '+fmt(x)+' penalty':''}. Loan balance after: ${fmt(i.bal)}.`],after:()=>{l.paid.push(i.n);if(l.paid.length>=l.n)l.status='closed';}};}};
EV.card2emi={title:'Convert card purchase to EMI',when:'The purchase is already recorded. This only restructures the debt and adds a financing cost.',
 fields:()=>[F('date','Date','date',{def:today()}),F('what','What','text'),F('amt','Amount converted','number',{hint:()=>'Card outstanding: '+fmt(bal('2300'))}),F('rate','Interest % p.a.','number',{def:14}),F('n','Tenure (months)','number',{def:12}),F('fee','Conversion fee','number',{def:0})],
 build:v=>{const amt=num(v.amt),fee=num(v.fee),n=Math.max(1,num(v.n)); const pid=ensureParty('Card EMI','lender'); const lines=[{acc:'2300',dr:amt},{acc:'2400',cr:amt,party:pid}]; if(fee)lines.push({acc:'5150',dr:fee},{acc:'2300',cr:fee}); const sch=schedule(amt,num(v.rate),n,addMonths(ym(v.date||today()),1));
  return {desc:`Card → EMI: ${v.what}`,lines,effects:[`Card down ${fmt(amt)}, loan up ${fmt(amt)}. Total debt unchanged.`,`This costs <b>${fmt(sch.reduce((s,x)=>s+x.int,0))}</b> interest over ${n} months${fee?' + '+fmt(fee)+' fee':''}.`],after:()=>S.loans.push({id:nid('L'),lender:'Card EMI',purpose:v.what,principal:amt,rate:num(v.rate),n,schedule:sch,paid:[],status:'active',party:pid})};}};
EV.transfer={title:'Move money between your own pockets',when:'Bank → petty cash, pay the card bill, reimburse the director. Never an expense.',
 fields:()=>[F('date','Date','date',{def:today()}),F('kind','Move','select',{opts:[['1000>1010','Bank → petty cash'],['1010>1000','Petty cash → bank'],['1000>2300','Pay credit-card bill'],['1000>2450','Reimburse director'],['2450>1000','Director puts money in']]}),F('amt','Amount','number')],
 build:v=>{const [f,t]=v.kind.split('>');const amt=num(v.amt);return {desc:`Transfer: ${A[f].name} → ${A[t].name}`,lines:[{acc:t,dr:amt},{acc:f,cr:amt}],effects:[`${fmt(amt)} moved. Profit unchanged.`]};}};
EV.statutory={title:'Pay GST / TDS / PF to government',when:'Remitting what you collected or withheld. Not an expense.',
 fields:()=>[F('date','Date','date',{def:today()}),F('kind','Which','select',{opts:[['gst','GST (net of input credit)'],['tds','TDS'],['pf','PF / ESI']]}),F('amt','Paid from bank','number',{hint:v=>({gst:`GST payable ${fmt(bal('2200'))} · input credit ${fmt(bal('1400'))}`,tds:'TDS payable '+fmt(bal('2250')),pf:'Dues '+fmt(bal('2550'))})[v.kind]}),F('input','Input credit used','number',{def:0,show:v=>v.kind==='gst'}),F('late','Interest / late fee','number',{def:0})],
 build:v=>{const amt=num(v.amt),inp=num(v.input),late=num(v.late);const acc={gst:'2200',tds:'2250',pf:'2550'}[v.kind];const lines=[{acc,dr:amt+inp-late}];if(inp)lines.push({acc:'1400',cr:inp});if(late)lines.push({acc:'5160',dr:late});lines.push({acc:'1000',cr:amt});return {desc:`${v.kind.toUpperCase()} remitted`,lines,effects:[`Liability cleared${late?'; '+fmt(late)+' late fee is a cost':''}.`]};}};
EV.vendorrefund={title:'Vendor refunded you',when:'Reduces the original cost.',
 fields:()=>[F('date','Date','date',{def:today()}),F('desc','What','text'),F('acc','Original category','select',{opts:EXP.map(a=>[a.code,a.name])}),F('amt','Amount','number'),F('via','Into','select',{opts:[['1000','Bank'],['2300','Card reversal']]})],
 build:v=>({desc:`Refund — ${v.desc}`,lines:[{acc:v.via,dr:num(v.amt)},{acc:v.acc,cr:num(v.amt)}],effects:[`${fmt(num(v.amt))} back; ${A[v.acc].name} reduced.`]})};

const CHOOSER=[['Deals',['newdeal','token','dealcost','invoice','dealpay','settle','commission']],['Money out',['expense','bill','paybill','salary','asset','petty','director']],['Money in & funding',['otherinc','funding','bankloan']],['Services',['subnew','confirmcharge','subchange','subcancel']],['Loans & adjustments',['emi','card2emi','transfer','statutory','vendorrefund','writeoff','absorb']]];

function runMonthEnd(m,silent){ let n=0;
  for(const s of S.subs){ if(s.payMode!=='upfront'||s.closedOut||m<s.start||m>s.end||s.amortized.includes(m)) continue; post({date:m+'-28',event:'monthend',desc:`Prepaid released — ${s.name} (${mlabel(m)})`,lines:[{acc:'5080',dr:s.monthly},{acc:'1200',cr:s.monthly}],auto:true}); s.amortized.push(m); n++; }
  for(const a of S.assets){ if(a.status!=='in use'||m<a.start||a.depreciated.includes(m)||a.depreciated.length>=a.life) continue; post({date:m+'-28',event:'monthend',desc:`Depreciation — ${a.name} (${mlabel(m)})`,lines:[{acc:'5200',dr:a.monthly},{acc:'1350',cr:a.monthly}],auto:true}); a.depreciated.push(m); n++; }
  S.monthEnds[m]=true; if(!silent){toast(`Month-end ${mlabel(m)}: ${n} automatic entries`); render();} }

// ============================================================ UI
const NAV=[['dash','Overview'],['deals','Deals'],['services','Services'],['owed','Owed both ways'],['loans','Loans & EMIs'],['assets','Assets'],['txns','All transactions'],['reports','Reports'],['books','Books (double entry)'],['guide','Guide']];
let view='dash', curDeal=null, repMonth=ym(today()), ledgerAcc='1000';
function go(v,arg){ view=v; if(v==='deal') curDeal=arg; render(); window.scrollTo(0,0); }
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function render(){ document.getElementById('sidenav').innerHTML=NAV.map(([k,l])=>`<button class="${view===k||(view==='deal'&&k==='deals')?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  document.getElementById('bottomnav').innerHTML=[['dash','Home'],['deals','Deals'],['services','Services'],['owed','Owed'],['reports','Reports'],['guide','Guide']].map(([k,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
  const V={dash,deals,deal:dealPage,services,owed,loans,assets,txns,reports,books,guide}; document.getElementById('main').innerHTML=V[view](); }

let evKey=null, vals={};
function openChooser(){ document.getElementById('modal').innerHTML=`<div style="grid-column:1/-1;padding:18px 20px"><div style="display:flex;align-items:center"><h3 style="margin:0">What happened?</h3><div class="spacer"></div><button class="btn ghost sm" onclick="closeModal()">✕</button></div><p class="small muted" style="margin:4px 0 10px">Deal, service and loan actions are also on their own pages, pre-filled.</p><div class="chooser">${CHOOSER.map(([g,ks])=>`<div class="eh">${g}</div>`+ks.map(k=>`<button onclick="openForm('${k}')"><b>${EV[k].title}</b></button>`).join('')).join('')}</div></div>`; document.getElementById('ov').classList.add('show'); }
function openForm(k,preset={}){ evKey=k; vals={...preset}; const ev=EV[k]; if(ev.onchange) for(const key of Object.keys(preset)) ev.onchange(key,vals); bindForm(); document.getElementById('ov').classList.add('show'); }
function closeModal(){ document.getElementById('ov').classList.remove('show'); }
function bindForm(){ const ev=EV[evKey]; const fields=typeof ev.fields==='function'?ev.fields(vals):ev.fields;
  for(const f of fields){ const opts=typeof f.opts==='function'?f.opts(vals):f.opts; if(f.type==='select'&&opts?.length&&!opts.some(o=>String(o[0])===String(vals[f.k]))){ vals[f.k]=opts[0][0]; if(ev.onchange) ev.onchange(f.k,vals);} if(vals[f.k]===undefined&&f.def!==undefined) vals[f.k]=f.def; }
  const fields2=typeof ev.fields==='function'?ev.fields(vals):ev.fields; // re-evaluate dependent option lists
  const html=`<div class="form"><div style="display:flex;align-items:center"><h3 style="margin:0">${ev.title}</h3><div class="spacer"></div><button class="btn ghost sm" onclick="closeModal()">✕</button></div><div style="height:10px"></div>`+fields2.filter(f=>!f.show||f.show(vals)).map(f=>{const hint=typeof f.hint==='function'?f.hint(vals):f.hint; const opts=typeof f.opts==='function'?f.opts(vals):f.opts; let inp;
   if(f.type==='select') inp=`<select data-k="${f.k}">${(opts||[]).map(([v,l])=>`<option value="${esc(v)}" ${String(vals[f.k])===String(v)?'selected':''}>${esc(l)}</option>`).join('')}${!(opts||[]).length?'<option value="">— none available —</option>':''}</select>`;
   else inp=`<input data-k="${f.k}" type="${f.type}" value="${esc(vals[f.k]??'')}" ${f.type==='number'?'inputmode="decimal" step="any"':''}>`;
   return `<div class="field"><label>${f.label}</label>${inp}${hint?`<div class="hint">${hint}</div>`:''}</div>`;}).join('')+`<button class="btn primary" style="width:100%;padding:12px;margin-top:6px" onclick="save()">Save</button></div><div class="side" id="preview"></div>`;
  document.getElementById('modal').innerHTML=html;
  document.querySelectorAll('#modal [data-k]').forEach(el=>el.addEventListener('input',e=>{vals[e.target.dataset.k]=e.target.value; if(ev.onchange)ev.onchange(e.target.dataset.k,vals); if(e.target.tagName==='SELECT')bindForm(); else updatePreview();}));
  updatePreview(); }
function dryBuild(){ const p0=S.parties.length,s0=S.seq; let out; try{out=EV[evKey].build({...vals});}catch(e){out={desc:'',lines:[],effects:['Fill in the form.']};} S.parties.length=p0;S.seq=s0; return out; }
function updatePreview(){ const ev=EV[evKey]; const out=dryBuild(); const ls=out.lines.filter(l=>num(l.dr)||num(l.cr)); const dr=ls.reduce((s,l)=>s+num(l.dr),0),cr=ls.reduce((s,l)=>s+num(l.cr),0); const ok=Math.abs(dr-cr)<0.5;
  document.getElementById('preview').innerHTML=`<div class="when"><b>When:</b> ${ev.when}</div><h3>What saving does</h3><ul class="effects">${out.effects.map(e=>`<li>${e}</li>`).join('')}</ul>${ls.length?`<div class="journal"><details><summary>Double-entry behind this (for your CA) — ${ok?'balanced ✓':'NOT balanced'}</summary>${ls.map(l=>`<div class="jl ${l.cr?'cr':''}"><span>${l.cr?'Cr. ':'Dr. '}${A[l.acc].name}${l.party?' <span class="tag">'+esc(pname(l.party))+'</span>':''}</span><span>${fmt(num(l.dr)||num(l.cr))}</span></div>`).join('')}<div class="jl ${ok?'':'bad'}" style="border-top:1px solid var(--line);margin-top:6px;padding-top:6px"><span>Dr ${fmt(dr)}</span><span>Cr ${fmt(cr)}</span></div></details></div>`:'<div class="small muted" style="margin-top:8px">No money movement — nothing posts to the books.</div>'}`; }
function save(){ const ev=EV[evKey]; let out; try{out=ev.build({...vals});}catch(e){toast(e.message);return;} const ls=out.lines.filter(l=>num(l.dr)||num(l.cr)); if(!ls.length&&!out.after){toast('Nothing to save');return;} let t=null; try{ if(ls.length) t=post({date:vals.date||today(),event:evKey,desc:out.desc,lines:ls,meta:{...vals}}); }catch(e){toast(e.message);return;} let ret; if(out.after) ret=out.after(t); toast('Saved'); closeModal(); if(evKey==='newdeal'&&ret) go('deal',ret); else render(); }

// ---------- PAGES ----------
function stat(l,v,cls='',s=''){return `<div class="card stat"><div class="l">${l}</div><div class="v ${cls}">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;}
function dash(){ const m=ym(today()); const p=pl(m); if(!S.txns.length&&!S.deals.length) return `<h1>Overview</h1><div class="empty">Start with <b>Deals → New deal</b>, or load <b>Demo</b> from the top bar to see three months of a working agent's books.</div>`;
  const cash=bal('1000'),petty=bal('1010'),card=bal('2300'),ar=bal('1100'),ap=bal('2000'),adv=bal('2100'),loans=bal('2400'); const run=S.subs.filter(s=>s.status==='active').reduce((s,x)=>s+x.monthly,0); const pend=S.subs.filter(s=>s.status==='active'&&s.payMode==='monthly'&&!s.charges[m]).length;
  const pipeline=S.deals.filter(d=>!['closed','dropped'].includes(d.status)); const expected=pipeline.reduce((s,d)=>s+Math.max(0,num(d.expSeller)+num(d.expBuyer)-dealFigures(d).income),0);
  return `<h1>Overview</h1><p class="lead">${mlabel(m)}. Every figure is derived from what you recorded.</p>
  <div class="grid g3">${stat('Income this month',fmt(p.ti),'in','earned, not just received')}${stat('Expenses this month',fmt(p.te),'out','incl. released prepaid & depreciation')}${stat('Profit this month',fmt(p.profit),p.profit>=0?'in':'out','loans, tokens, EMI principal excluded')}</div>
  <h2>Cash</h2><div class="grid g4">${stat('Bank',fmt(cash))}${stat('Petty cash',fmt(petty))}${stat('Card owed',fmt(card),'out')}${stat('Free to use',fmt(cash+petty-ap-adv),cash+petty-ap-adv>=0?'':'out','cash − vendor dues − tokens held')}</div>
  <h2>Pipeline & position</h2><div class="grid g4">${stat('Open deals',pipeline.length,'',`expected still to invoice: ${fmt(expected)}`)}${stat('Clients owe you',fmt(ar),'in')}${stat('You owe',fmt(ap),'out')}${stat('Tokens held',fmt(adv),'','not income yet')}</div>
  <div class="grid g4" style="margin-top:12px">${stat('Services run-rate',fmt(run)+'<span class="small muted">/mo</span>','',pend?`<span class="pill or">${pend} to confirm this month</span>`:'all confirmed')}${stat('Loans outstanding',fmt(loans),'out')}${stat('GST due (net)',fmt(bal('2200')-bal('1400')),'','by the 20th')}${stat('TDS to deposit',fmt(bal('2250')),'','by the 7th')}</div>
  <h2>Month-end</h2><div class="card"><div class="toolbar"><span>Run for</span><input type="month" id="mem" value="${addMonths(m,-1)}"><button class="btn" onclick="runMonthEnd(document.getElementById('mem').value)">Post automatic entries</button><span class="small muted">Releases upfront subscriptions and posts depreciation. Never duplicates.</span></div><div class="small muted">Done: ${Object.keys(S.monthEnds).sort().map(mlabel).join(', ')||'none yet'}</div></div>`; }

const STATUS={open:['Open','blue'],token:['Token held','or'],registered:['Registered','in'],closed:['Closed','in'],dropped:['Dropped','out']};
function deals(){ return `<h1>Deals</h1><p class="lead">Every deal with its expected vs actual brokerage, costs, partner share and net. Tap a deal for its ledger and actions.</p><div class="actions"><button class="btn primary" onclick="openForm('newdeal')">New deal</button></div>
  ${S.deals.length?`<div class="card" style="padding:0 6px"><table><tr><th>Property</th><th>Status</th><th class="n">Expected</th><th class="n">Invoiced</th><th class="n">Costs</th><th class="n">Partner</th><th class="n">Net</th><th class="n">Held</th><th class="n">Owed</th></tr>${S.deals.map(d=>{const f=dealFigures(d);const st=STATUS[d.status];return `<tr class="click" onclick="go('deal','${d.id}')"><td><b>${esc(d.property)}</b><div class="small muted">${pname(d.seller)}${d.buyer?' · '+pname(d.buyer):''}</div></td><td><span class="pill ${st[1]}">${st[0]}</span></td><td class="n muted">${fmt(f.expected)}</td><td class="n">${fmt(f.income)}</td><td class="n">${fmt(f.costs)}</td><td class="n">${fmt(f.comm)}</td><td class="n ${f.net>=0?'in':'out'}"><b>${fmt(f.net)}</b></td><td class="n">${f.tokens>0.5?fmt(f.tokens):'—'}</td><td class="n">${f.recv>0.5?fmt(f.recv):'—'}</td></tr>`;}).join('')}</table></div>`:'<div class="empty">No deals yet.</div>'}`; }

function dealPage(){ const d=deal(curDeal); if(!d) return deals(); const f=dealFigures(d); const steps=['open','token','registered','closed']; const idx=steps.indexOf(d.status);
  const lines=[]; for(const t of [...S.txns].sort((a,b)=>a.date.localeCompare(b.date))) if(t.lines.some(l=>l.deal===d.id)) lines.push(t);
  const held=[d.seller,d.buyer].filter(Boolean).map(p=>[p,bal('2100',{party:p,deal:d.id})]).filter(([,v])=>v>0.5); const owed=[d.seller,d.buyer].filter(Boolean).map(p=>[p,bal('1100',{party:p,deal:d.id})]).filter(([,v])=>v>0.5); const live=!['closed','dropped'].includes(d.status);
  return `<button class="btn ghost sm" onclick="go('deals')">← Deals</button><h1>${esc(d.property)}</h1><p class="lead">Seller: ${pname(d.seller)} · Buyer: ${d.buyer?pname(d.buyer):`<a href="#" onclick="setBuyer('${d.id}');return false">add buyer</a>`} · opened ${d.opened}</p>
  ${d.status==='dropped'?'<div class="note">This deal is dropped.</div>':`<div class="steps">${steps.map((s,i)=>`<span class="${i<idx?'done':i===idx?'on':''}">${['Open','Token','Registered','Closed'][i]}</span>`).join('')}</div>`}
  <div class="actions" style="margin-top:12px">${live?`<button class="btn primary" onclick="openForm('token',{deal:'${d.id}'})">Token received</button><button class="btn" onclick="openForm('dealcost',{deal:'${d.id}'})">Cost for this deal</button><button class="btn" onclick="openForm('invoice',{deal:'${d.id}'})">Registered — invoice</button>`:''}${f.recv>0.5?`<button class="btn" onclick="openForm('dealpay',{deal:'${d.id}'})">Client pays</button>`:''}${f.tokens>0.5?`<button class="btn" onclick="openForm('settle',{deal:'${d.id}'})">Settle token</button>`:''}<button class="btn" onclick="openForm('commission',{deal:'${d.id}'})">Partner share</button>${f.recv>0.5?`<button class="btn" onclick="openForm('writeoff',{deal:'${d.id}'})">Write off</button><button class="btn" onclick="openForm('absorb',{deal:'${d.id}'})">Absorb recoverable</button>`:''}${d.status==='registered'&&f.recv<0.5&&f.tokens<0.5?`<button class="btn" onclick="setStatus('${d.id}','closed')">Mark closed</button>`:''}${['open','token'].includes(d.status)&&f.tokens<0.5&&f.recv<0.5?`<button class="btn danger" onclick="setStatus('${d.id}','dropped')">Drop deal</button>`:''}</div>
  <div class="grid g4">${stat('Expected',fmt(f.expected),'','seller '+fmt(d.expSeller)+' · buyer '+fmt(d.expBuyer))}${stat('Invoiced',fmt(f.income),'in')}${stat('Costs + partner',fmt(f.costs+f.comm),'out')}${stat('Net on this deal',fmt(f.net),f.net>=0?'in':'out')}</div>
  <div class="grid g2" style="margin-top:12px"><div class="card"><h3>Tokens held</h3>${held.length?held.map(([p,v])=>`<div class="jl"><span>${pname(p)}</span><b>${fmt(v)}</b></div>`).join(''):'<span class="muted small">None</span>'}</div><div class="card"><h3>Owed to you (invoice + recoverable costs)</h3>${owed.length?owed.map(([p,v])=>`<div class="jl"><span>${pname(p)}</span><b>${fmt(v)}</b></div>`).join(''):'<span class="muted small">Nothing outstanding</span>'}</div></div>
  <h2>Everything on this deal</h2>${lines.length?`<div class="card" style="padding:0 6px"><table><tr><th>Date</th><th>What</th><th class="n">Income</th><th class="n">Cost</th><th class="n">Cash</th></tr>${lines.map(t=>{let inc=0,cost=0,cash=0;for(const l of t.lines){const ty=A[l.acc].type;if(l.deal===d.id&&ty==='income')inc+=num(l.cr)-num(l.dr);if(l.deal===d.id&&ty==='expense')cost+=num(l.dr)-num(l.cr);if(['1000','1010'].includes(l.acc))cash+=num(l.dr)-num(l.cr);}return `<tr class="${t.reversedBy?'rev':''}"><td class="small">${t.date}</td><td>${esc(t.desc)}</td><td class="n in">${inc?fmt(inc):''}</td><td class="n out">${cost?fmt(cost):''}</td><td class="n">${cash?fmt(cash):''}</td></tr>`;}).join('')}</table></div>`:'<div class="empty">Nothing recorded yet.</div>'}`; }

  const row=s=>{const c=s.charges?.[m]; const status=s.payMode==='upfront'?(s.amortized.includes(m)?'<span class="pill in">released</span>':'<span class="pill">at month-end</span>'):(c?(c.skipped?'<span class="pill">not charged</span>':`<span class="pill in">confirmed ${fmt(c.actual)}</span>`):'<span class="pill or">to confirm</span>');
   return `<tr><td><b>${esc(s.name)}</b><div class="small muted">${esc(s.vendor||'')}${s.use?' · '+esc(s.use):''}</div></td><td>${s.payMode==='upfront'?`Upfront ${fmt(s.amount)} / ${s.months} mo<div class="small muted">${fmt(prepaidLeft(s))} unused</div>`:'Monthly'}</td><td class="n">${fmt(s.monthly)}</td><td>${s.start}${s.end?' → '+s.end:''}</td><td>${s.status==='active'?status:`<span class="pill">${s.status}</span>`}</td><td class="n">${s.status==='active'?`${s.payMode==='monthly'&&!c?`<button class="btn sm primary" onclick="openForm('confirmcharge',{sub:'${s.id}',month:'${m}',amt:${s.monthly}})">Confirm</button> `:''}<button class="btn sm" onclick="openForm('subchange',{sub:'${s.id}'})">Change</button> <button class="btn sm" onclick="openForm('subcancel',{sub:'${s.id}'})">Cancel</button>`:s.status==='paused'?`<button class="btn sm" onclick="openForm('subcancel',{sub:'${s.id}',action:'resume'})">Resume</button>`:''}</td></tr>`;};
  return `<h1>Services</h1><p class="lead">Expected vs actual, every month. Add a service once; confirm what was really charged each month.</p>
  <div class="grid g3">${stat('Run-rate (expected)',fmt(run)+'<span class="small muted">/mo</span>','',act.length+' active')}${stat('This month: expected → actual',`${fmt(expected)} → ${fmt(actual)}`,'',monthly.filter(s=>!s.charges[m]).length+' still to confirm')}${stat('Unused prepaid with vendors',fmt(act.filter(s=>s.payMode==='upfront').reduce((a,s)=>a+prepaidLeft(s),0)),'','recoverable if refunded')}</div>
  <div class="actions" style="margin-top:12px"><button class="btn primary" onclick="openForm('subnew')">Add service</button></div>
  ${act.length?`<div class="card" style="padding:0 6px"><table><tr><th>Service</th><th>Plan</th><th class="n">Per month</th><th>Period</th><th>${mlabel(m)}</th><th></th></tr>${act.map(row).join('')}</table></div>`:'<div class="empty">No services yet.</div>'}
  ${other.length?`<h2>History</h2><div class="card" style="padding:0 6px"><table>${other.map(row).join('')}</table></div>`:''}`; }

function loans(){ const head=`<h1>Loans & EMIs</h1><p class="lead">Principal reduces the loan; interest is the only cost.</p><div class="actions"><button class="btn" onclick="openForm('bankloan')">Add bank loan</button><button class="btn" onclick="openForm('card2emi')">Convert card to EMI</button></div>`; if(!S.loans.length) return head+'<div class="empty">No loans.</div>';

   return `<div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">${esc(l.lender)} — ${esc(l.purpose)}</h3><span class="pill ${l.status==='active'?'or':''}">${l.status}</span><div class="spacer"></div>${next?`<button class="btn sm primary" onclick="openForm('emi',{loan:'${l.id}'})">Pay EMI ${next.n}/${l.n} · ${fmt(next.emi)}</button>`:''}</div>
   <div class="grid g4" style="margin-top:10px"><div class="stat"><div class="l">Borrowed</div><div class="v">${fmt(l.principal)}</div></div><div class="stat"><div class="l">Outstanding</div><div class="v out">${fmt(next?next.bal+next.prin:0)}</div></div><div class="stat"><div class="l">Interest paid</div><div class="v">${fmt(paidInt)}</div><div class="s">of ${fmt(tot)} total</div></div><div class="stat"><div class="l">Next split</div><div class="v" style="font-size:15px">${next?`${fmt(next.int)} interest + ${fmt(next.prin)} principal`:'—'}</div></div></div>
   <details style="margin-top:8px"><summary class="small muted">Schedule</summary><table><tr><th>#</th><th>Month</th><th class="n">EMI</th><th class="n">Interest</th><th class="n">Principal</th><th class="n">Balance</th><th></th></tr>${l.schedule.map(s=>`<tr class="${l.paid.includes(s.n)?'sub':''}"><td>${s.n}</td><td>${mlabel(s.month)}</td><td class="n">${fmt(s.emi)}</td><td class="n">${fmt(s.int)}</td><td class="n">${fmt(s.prin)}</td><td class="n">${fmt(s.bal)}</td><td>${l.paid.includes(s.n)?'<span class="pill in">paid</span>':''}</td></tr>`).join('')}</table></details></div>`;}).join(''); }

function reports(){ const months=[...new Set(S.txns.map(t=>ym(t.date)))].sort().reverse(); if(!months.includes(repMonth)&&months.length)repMonth=months[0]; const p=pl(repMonth),all=pl(null);

  <div><div class="card"><h3>Last 6 months</h3>${last6.map(x=>`<div style="display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;font-size:13px;margin:5px 0"><span class="muted">${mlabel(x.m)}</span><div><div class="bar" style="width:${x.p.ti/mx*100}%"></div><div class="bar o" style="width:${x.p.te/mx*100}%;margin-top:3px"></div></div><b style="text-align:right;color:${x.p.profit>=0?'var(--in)':'var(--out)'}">${fmt(x.p.profit)}</b></div>`).join('')}</div>
  <div class="card" style="margin-top:12px"><h3>Since the beginning</h3><div class="grid g3"><div class="stat"><div class="l">Income</div><div class="v in">${fmt(all.ti)}</div></div><div class="stat"><div class="l">Expenses</div><div class="v out">${fmt(all.te)}</div></div><div class="stat"><div class="l">Retained profit</div><div class="v">${fmt(all.profit)}</div></div></div></div></div></div>
  <h2>Deal profitability</h2>${dealsDone.length?`<div class="card" style="padding:0 6px"><table><tr><th>Deal</th><th class="n">Expected</th><th class="n">Invoiced</th><th class="n">Costs</th><th class="n">Partner</th><th class="n">Net</th><th class="n">Margin</th></tr>${dealsDone.map(d=>{const f=dealFigures(d);return `<tr><td>${esc(d.property)}</td><td class="n muted">${fmt(f.expected)}</td><td class="n">${fmt(f.income)}</td><td class="n">${fmt(f.costs)}</td><td class="n">${fmt(f.comm)}</td><td class="n"><b>${fmt(f.net)}</b></td><td class="n">${f.income?Math.round(f.net/f.income*100)+'%':'—'}</td></tr>`;}).join('')}</table></div>`:'<div class="empty">No invoiced deals yet.</div>'}`; }

function books(){ const tb=ACCOUNTS.map(a=>{let d=0,c=0;for(const t of S.txns)for(const l of t.lines)if(l.acc===a.code){d+=num(l.dr);c+=num(l.cr);}return {a,net:d-c,any:d||c};}).filter(x=>x.any); const td=tb.reduce((s,x)=>s+Math.max(x.net,0),0),tc=tb.reduce((s,x)=>s+Math.max(-x.net,0),0);
  const bs=ty=>ACCOUNTS.filter(a=>a.type===ty).map(a=>[a,bal(a.code)]).filter(([,v])=>Math.abs(v)>0.5); const ret=pl(null).profit; const at=bs('asset').reduce((s,[,v])=>s+v,0),lt=bs('liability').reduce((s,[,v])=>s+v,0),et=bs('equity').reduce((s,[,v])=>s+v,0)+ret;
  const led=[];for(const t of [...S.txns].sort((a,b)=>a.date.localeCompare(b.date)))for(const l of t.lines)if(l.acc===ledgerAcc)led.push({t,l});let run=0;
  return `<h1>Books</h1><p class="lead">Same data, in the form your CA, Tally or Zoho expects. Every entry already balances — the conversion is done.</p>
  <h2>Trial balance</h2><div class="card" style="padding:0 6px"><table><tr><th>Account</th><th class="n">Debit</th><th class="n">Credit</th></tr>${tb.map(x=>`<tr><td>${x.a.code} · ${x.a.name}</td><td class="n">${x.net>0?fmt(x.net):''}</td><td class="n">${x.net<0?fmt(-x.net):''}</td></tr>`).join('')}<tr class="total"><td>Total</td><td class="n">${fmt(td)}</td><td class="n">${fmt(tc)}</td></tr></table><div class="small" style="padding:8px">${Math.abs(td-tc)<1?'Balanced ✓':'<span class="pill out">Not balanced</span>'}</div></div>
  <h2>Balance sheet (today)</h2><div class="grid g2"><div class="card"><table><tr><th>Assets</th><th></th></tr>${bs('asset').map(([a,v])=>`<tr class="sub"><td>${a.name}</td><td class="n">${fmt(v)}</td></tr>`).join('')}<tr class="total"><td>Total</td><td class="n">${fmt(at)}</td></tr></table></div><div class="card"><table><tr><th>Liabilities</th><th></th></tr>${bs('liability').map(([a,v])=>`<tr class="sub"><td>${a.name}</td><td class="n">${fmt(v)}</td></tr>`).join('')}<tr><th>Equity</th><th></th></tr>${bs('equity').map(([a,v])=>`<tr class="sub"><td>${a.name}</td><td class="n">${fmt(v)}</td></tr>`).join('')}<tr class="sub"><td>Retained profit</td><td class="n">${fmt(ret)}</td></tr><tr class="total"><td>Total</td><td class="n">${fmt(lt+et)}</td></tr></table><div class="small muted" style="padding:6px 8px">${Math.abs(at-lt-et)<1?'Assets = Liabilities + Equity ✓':'Does not balance'}</div></div></div>
  <h2>Ledger</h2><div class="toolbar"><select onchange="ledgerAcc=this.value;render()">${ACCOUNTS.map(a=>`<option value="${a.code}" ${a.code===ledgerAcc?'selected':''}>${a.code} · ${a.name}</option>`).join('')}</select></div><div class="card" style="padding:0 6px"><table><tr><th>Date</th><th>Entry</th><th class="n">Dr</th><th class="n">Cr</th><th class="n">Running</th></tr>${led.map(({t,l})=>{const ty=A[ledgerAcc].type;run+=(ty==='asset'||ty==='expense')?num(l.dr)-num(l.cr):num(l.cr)-num(l.dr);return `<tr><td class="small">${t.date}</td><td>${esc(t.desc)}${l.party?' <span class="tag">'+esc(pname(l.party))+'</span>':''}</td><td class="n">${l.dr?fmt(l.dr):''}</td><td class="n">${l.cr?fmt(l.cr):''}</td><td class="n">${fmt(run)}</td></tr>`;}).join('')||'<tr><td colspan="5" class="muted">No entries</td></tr>'}</table></div>
  <div class="card" style="margin-top:14px"><b>Export for your accountant</b><p class="small muted">Every entry with account codes, parties, deals and balanced Dr/Cr — importable into Tally / Zoho as journals.</p><button class="btn" onclick="exportJournalCSV()">Download journal CSV</button></div>`; }

function guide(){ return `<h1>Guide</h1><p class="lead">You record what happened; the system keeps double-entry books underneath. This page maps real situations to the button to press.</p>
<div class="note"><b>The one idea.</b> Money moving and cost happening are different things. A ₹24,000 annual plan is cash out once but ₹2,000 of cost a month. A ₹15,000 EMI is cash out ₹15,000 but only the interest is a cost. Tokens are cash in but not income. The system tracks both — that's why the profit figure is honest.</div>
<h2>Deals — the normal life of one</h2><table>
<tr><td>Enquiry becomes serious</td><td><b>Deals → New deal.</b> Enter property, seller, buyer if known, expected brokerage from each side. Nothing posts to the books yet.</td></tr>
<tr><td>Client pays a token</td><td>Deal page → <b>Token received.</b> Held, not income.</td></tr>
<tr><td>You pay for EC / patta / lawyer</td><td>Deal page → <b>Cost for this deal.</b> "Company" = your expense on the deal. "Recover from seller/buyer" = you paid on their behalf; it sits as owed by them and shows on the settlement.</td></tr>
<tr><td>Deal registers</td><td>Deal page → <b>Registered — invoice.</b> Income is earned now. Tokens auto-adjust. TDS the client deducts is parked as your claim. Recoverable costs are added to what they owe. Do this once per side (seller, then buyer).</td></tr>
<tr><td>Client pays the balance</td><td>Deal page → <b>Client pays.</b> No income again.</td></tr>
<tr><td>Partner from the Realtor Club gets a share</td><td>Deal page → <b>Partner share.</b> TDS 194H withheld; the cost counts against this deal.</td></tr>
<tr><td>All collected</td><td>Deal page → <b>Mark closed.</b> Deal net is final.</td></tr></table>
<h2>Deals — when it doesn't go to plan</h2><table>
<tr><td>Deal falls through, refund the token</td><td>Deal page → <b>Settle token</b> → Refund = full amount. Profit untouched.</td></tr>
<tr><td>Client says "keep the token"</td><td><b>Settle token</b> → Keep = amount. Becomes income now under "Forfeited advances" (GST usually applies).</td></tr>
<tr><td>Refund part, keep part</td><td><b>Settle token</b> → Refund X, Keep Y. Anything left stays held.</td></tr>
<tr><td>Client wants the token held for another property</td><td><b>Settle token</b> → Refund 0, Keep 0, Move remainder to the other deal.</td></tr>
<tr><td>Client says "keep it with you for now"</td><td>Do nothing — it stays held on the deal and appears in Tokens held. Settle when they decide.</td></tr>
<tr><td>Client won't reimburse the EC/patta you paid</td><td>Deal page → <b>Absorb recoverable.</b> It becomes your deal cost.</td></tr>
<tr><td>Client will never pay the brokerage</td><td>Deal page → <b>Write off.</b> Loss booked; receivable removed.</td></tr>
<tr><td>Written-off client pays later</td><td>+ Record → <b>Other income</b> → Bad debt recovered.</td></tr></table>
<h2>Services — estimate → actual</h2><table>
<tr><td>Subscribe to a tool</td><td>Services → <b>Add service.</b> Monthly = enter the expected charge. Upfront = enter what you paid and the term.</td></tr>
<tr><td>Monthly debit happened</td><td>Services → <b>Confirm.</b> Enter the real amount (pay-as-you-go can differ). Or "not charged this month".</td></tr>
<tr><td>Upfront plan, each month</td><td>Nothing to do — month-end releases 1/term of the cost automatically.</td></tr>
<tr><td>Upgrade / downgrade</td><td>Services → <b>Change.</b> Old line closes, new line starts on the effective date. Unused upfront balance: refund or loss.</td></tr>
<tr><td>Cancel an annual plan after 3 months</td><td>Services → <b>Cancel</b> → enter refund received. Unused minus refund = loss this month.</td></tr>
<tr><td>Pause / resume</td><td>Services → Cancel → Pause. Later → Resume.</td></tr></table>
<h2>Loans, cards, EMIs</h2><table>
<tr><td>Bank loan received</td><td>Loans → <b>Add bank loan.</b> Not income. Schedule generated.</td></tr>
<tr><td>EMI debited</td><td>Loans → <b>Pay EMI.</b> Split into principal (not a cost) and interest (cost) automatically.</td></tr>
<tr><td>Bought on card, converted to EMI later</td><td>Record the purchase paid via Credit card. Then Loans → <b>Convert card to EMI.</b> Then Pay EMI monthly.</td></tr>
<tr><td>Card bill paid</td><td>+ Record → <b>Move money</b> → Pay credit-card bill. Not an expense.</td></tr>
<tr><td>Late fee, bounce, processing fee</td><td>Fields on the loan and EMI forms — always separate cost lines.</td></tr></table>
<h2>Everything else</h2><table>
<tr><td>Rent, EB, fuel, print, food</td><td>+ Record → <b>Expense paid now.</b></td></tr>
<tr><td>Vendor bill to pay later; CA / lawyer fees</td><td><b>Bill received</b> (TDS by section). Later: Owed → <b>Pay.</b></td></tr>
<tr><td>Salary</td><td><b>Salary / bonus</b> with deductions.</td></tr>
<tr><td>Laptop, camera, furniture</td><td>Assets → <b>Buy an asset.</b> Depreciates monthly.</td></tr>
<tr><td>Capital or loan from you</td><td><b>Capital / director loan.</b> Never income.</td></tr>
<tr><td>You paid from your own pocket</td><td><b>Director paid personally.</b> Reimburse via Move money.</td></tr>
<tr><td>GST / TDS payment</td><td><b>Pay GST / TDS to government.</b></td></tr>
